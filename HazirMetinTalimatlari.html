<script type="module">
  // ---- Grup Firmaları: Talimat Hazırlama'daki ile aynı mantık. Bu sayfa
  // genelde index.html içinde bir iframe olarak açıldığı için, üst pencerenin
  // zaten kurulu auth/db nesnesini paylaşırız (ayrı bir Firebase Auth örneği
  // açıp olası IndexedDB yarış durumuna sebep olmamak için).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWzcRqmwhIBqjnYqyMoIrO8zj2p8oj5kU",
    authDomain: "mmgcreativity-31263.firebaseapp.com",
    projectId: "mmgcreativity-31263",
    storageBucket: "mmgcreativity-31263.firebasestorage.app",
    messagingSenderId: "243143536600",
    appId: "1:243143536600:web:daa53a2614b42a2ccb8cad",
    measurementId: "G-X8HEZRNWWS"
  };
  let auth, db;
  try{
    if(window.parent && window.parent !== window && window.parent.mmgAuth && window.parent.mmgDb){
      auth = window.parent.mmgAuth;
      db = window.parent.mmgDb;
    }
  }catch(e){ /* farklı origin ihtimaline karşı sessizce geç */ }
  if(!auth || !db){
    const fbApp = initializeApp(firebaseConfig);
    auth = getAuth(fbApp);
    db = getFirestore(fbApp);
  }

  window.mmgGroupFirmalar = []; // [{ id, name }] — hazır olduğunda dolduruluyor
  onAuthStateChanged(auth, async (user) => {
    if(!user) return;
    try{
      let scopeCollection = 'users', scopeId = user.uid;
      const activeScope = localStorage.getItem('mmg_active_data_scope');
      if(activeScope && activeScope !== 'personal'){
        scopeCollection = 'firmaAccounts';
        scopeId = activeScope;
      } else if(!activeScope){
        const uSnap = await getDoc(doc(db, 'users', user.uid));
        const uData = uSnap.exists() ? uSnap.data() : {};
        if(uData.companyId){
          scopeCollection = 'companies';
          scopeId = localStorage.getItem('mmg_active_company_id') || uData.companyId;
        }
      }
      if(scopeCollection !== 'firmaAccounts') return; // grup kavramı sadece firma hesaplarında var
      const fSnap = await getDoc(doc(db, 'firmaAccounts', scopeId));
      const fData = fSnap.exists() ? fSnap.data() : {};
      const hubId = fData.dataGroupId || scopeId;
      const hubSnap = hubId === scopeId ? fSnap : await getDoc(doc(db, 'firmaAccounts', hubId));
      const members = new Map();
      members.set(hubId, hubSnap.exists() ? (hubSnap.data().name || hubId) : hubId);
      if(!members.has(scopeId)) members.set(scopeId, fData.name || scopeId);
      const qSnap = await getDocs(query(collection(db, 'firmaAccounts'), where('dataGroupId', '==', hubId)));
      qSnap.forEach(d => members.set(d.id, d.data().name || d.id));
      window.mmgGroupFirmalar = Array.from(members, ([id, name]) => ({ id, name }));
      document.dispatchEvent(new CustomEvent('mmg-group-firmalar-ready'));
    }catch(e){ /* sessizce geç: grup yoksa ya da erişilemiyorsa sadece kayıtlı liste kullanılır */ }
  });

  // ---- Özelleştirilmiş Banka Listesi (VeriGirisPaneli.html > Bankalarım > Çalıştığım
  // Bankalar sekmesinde düzenlenir) — hiç kaydedilmemişse aşağıdaki (plain script'teki)
  // varsayılan liste aynen kullanılmaya devam eder, hiçbir şey bozulmaz.
  onAuthStateChanged(auth, async (user) => {
    if(!user) return;
    try{
      let scopeCollection = 'users', scopeId = user.uid;
      const activeScope = localStorage.getItem('mmg_active_data_scope');
      if(activeScope && activeScope !== 'personal'){
        scopeCollection = 'firmaAccounts';
        scopeId = activeScope;
      } else if(!activeScope){
        const uSnap = await getDoc(doc(db, 'users', user.uid));
        const uData = uSnap.exists() ? uSnap.data() : {};
        if(uData.companyId){
          scopeCollection = 'companies';
          scopeId = localStorage.getItem('mmg_active_company_id') || uData.companyId;
        }
      }
      let effectiveScopeId = scopeId;
      if(scopeCollection === 'firmaAccounts'){
        const fSnap = await getDoc(doc(db, 'firmaAccounts', scopeId));
        const fData = fSnap.exists() ? fSnap.data() : {};
        if(fData.dataGroupId) effectiveScopeId = fData.dataGroupId;
      }
      const listSnap = await getDoc(doc(db, scopeCollection, effectiveScopeId, 'settings', 'bankList'));
      if(listSnap.exists() && Array.isArray(listSnap.data().names) && listSnap.data().names.length){
        window.mmgCustomBanks = listSnap.data().names;
        document.dispatchEvent(new CustomEvent('mmg-bank-list-ready'));
      }
    }catch(e){ /* sessizce geç */ }
  });
</script>

      muhatap:function(v){ return v.banka; }, firma:function(v){ return v.firma; } }

  let activeCat = 'Tümü';
  let activeTemplate = null;

  function categories(){
    var seen = {}; var out = ['Tümü'];
    TEMPLATES.forEach(function(t){ if(!seen[t.cat]){ seen[t.cat]=true; out.push(t.cat); } });
    return out;
  }

  function renderChips(){
    const wrap = document.getElementById('catChips');
    wrap.innerHTML = categories().map(function(c){
      return '<span class="cat-chip' + (c === activeCat ? ' active' : '') + '" data-cat="' + c + '">' + c + '</span>';
    }).join('');
    wrap.querySelectorAll('.cat-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        activeCat = chip.dataset.cat;
        renderChips();
        applyFilter();
      });
    });
  }

  function renderList(list){
    const container = document.getElementById('tplContainer');
    if(!list.length){
      container.innerHTML = '<div class="empty-note">Aramanızla eşleşen bir şablon bulunamadı.</div>';
      return;
    }
    var seen = {}; var cats = [];
    list.forEach(function(t){ if(!seen[t.cat]){ seen[t.cat]=true; cats.push(t.cat); } });
    container.innerHTML = cats.map(function(cat){
      const items = list.filter(function(t){ return t.cat === cat; });
      return '<div class="cat-label">' + cat + '</div><div class="tpl-grid">' +
        items.map(function(t){
          const idx = TEMPLATES.indexOf(t);
          return '<div class="tpl-card" data-idx="' + idx + '"><h3>' + t.title + '</h3><p>' + t.fields.length + ' alan doldurarak oluşturun</p></div>';
        }).join('') + '</div>';
    }).join('');
    container.querySelectorAll('.tpl-card').forEach(function(card){
      card.addEventListener('click', function(){ openModal(TEMPLATES[Number(card.dataset.idx)]); });
    });
  }

  function applyFilter(){
    const q = document.getElementById('tplSearch').value.trim().toLocaleLowerCase('tr-TR');
    let list = TEMPLATES;
    if(activeCat !== 'Tümü') list = list.filter(function(t){ return t.cat === activeCat; });
    if(q) list = list.filter(function(t){ return t.title.toLocaleLowerCase('tr-TR').indexOf(q) !== -1 || t.cat.toLocaleLowerCase('tr-TR').indexOf(q) !== -1; });
    renderList(list);
  }

  document.getElementById('tplSearch').addEventListener('input', applyFilter);

  // ---- Talimat Hazırlama'da kayıtlı firma/kişi listelerini oku (aynı localStorage anahtarları) ----
  function readSavedList(key){
    try{
      const raw = localStorage.getItem(key);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }

  const backdrop = document.getElementById('modalBackdrop');
  function openModal(tpl){
    activeTemplate = tpl;
    document.getElementById('modalTitle').textContent = tpl.title;
    document.getElementById('modalCat').textContent = tpl.cat;
    const fieldsEl = document.getElementById('modalFields');
    fieldsEl.innerHTML = tpl.fields.map(function(f){
      if(f.type === 'select'){
        return '<div class="modal-field"><label>' + f.label + '</label><select data-key="' + f.key + '">' +
          '<option value="">— Seçiniz —</option>' +
          f.options.map(function(o){ return '<option value="' + o + '">' + o + '</option>'; }).join('') +
          '</select></div>';
      }
      if(f.source){
        let saved = readSavedList(f.source);
        if(f.key === 'firma' && Array.isArray(window.mmgGroupFirmalar) && window.mmgGroupFirmalar.length){
          const grupAdlari = window.mmgGroupFirmalar.map(function(g){ return g.name; });
          saved = grupAdlari.concat(saved.filter(function(s){ return grupAdlari.indexOf(s) === -1; }));
        }
        const dlId = 'dl_' + f.key;
        const dl = saved.length ? '<datalist id="' + dlId + '">' + saved.map(function(s){ return '<option value="' + String(s).replace(/"/g,'&quot;') + '">'; }).join('') + '</datalist>' : '';
        return '<div class="modal-field"><label>' + f.label + (saved.length ? ' <span style="color:var(--teal); font-weight:400;">· kayıtlılardan seçebilirsiniz</span>' : '') + '</label>' +
          '<input type="text" data-key="' + f.key + '" placeholder="' + (f.placeholder||'') + '" list="' + dlId + '">' + dl + '</div>';
      }
      return '<div class="modal-field"><label>' + f.label + '</label><input type="text" data-key="' + f.key + '" placeholder="' + (f.placeholder||'') + '"></div>';
    }).join('');
    fieldsEl.querySelectorAll('input, select').forEach(function(el){ el.addEventListener('input', updatePreview); });
    updatePreview();
    backdrop.classList.add('open');
  }
  function closeModal(){
    backdrop.classList.remove('open');
    activeTemplate = null;
  }
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeModal(); });

  function readValues(){
    const v = {};
    document.querySelectorAll('#modalFields [data-key]').forEach(function(el){
      v[el.dataset.key] = el.value.trim() || ('(' + (el.previousElementSibling ? el.previousElementSibling.textContent : el.dataset.key) + ')');
    });
    return v;
  }
  function updatePreview(){
    if(!activeTemplate) return;
    const v = readValues();
    document.getElementById('modalPreview').textContent = activeTemplate.body(v);
  }

  document.getElementById('modalUseBtn').addEventListener('click', function(){
    if(!activeTemplate) return;
    const v = readValues();
    const text = activeTemplate.body(v);
    const firma = activeTemplate.firma ? activeTemplate.firma(v) : '';
    const muhatapAdi = activeTemplate.muhatap ? activeTemplate.muhatap(v) : '';
    // Yeni girilen firma/kişi isimlerini de Talimat Hazırlama'nın kayıtlı
    // listelerine ekle, böylece bir dahaki sefere oradan/buradan seçilebilsin.
    try{
      activeTemplate.fields.forEach(function(f){
        if(!f.source) return;
        const val = v[f.key];
        if(!val || val.indexOf('(') === 0) return; // boş bırakılmış placeholder değeri ekleme
        const list = readSavedList(f.source);
        if(list.indexOf(val) === -1){
          list.push(val);
          localStorage.setItem(f.source, JSON.stringify(list));
        }
      });
    }catch(e){ /* sessizce geç */ }
    try{
      localStorage.setItem('mmg_pending_sm_text', text);
      if(muhatapAdi) { localStorage.setItem('mmg_pending_sm_muhataptur', 'banka'); localStorage.setItem('mmg_pending_sm_muhatapadi', muhatapAdi); }
      if(firma) localStorage.setItem('mmg_pending_sm_firma', firma);
    }catch(e){}
    window.location.href = 'Talimat_Hazirlama.html';
  });

  renderChips();
  renderList(TEMPLATES);

  // Grup firmaları listesi modal açıkken gelirse (Firebase asenkron olduğu için),
  // Firma Adı alanının datalist'ini yerinde güncelle — kullanıcının o ana kadar
  // yazdığı değeri bozmadan.
  document.addEventListener('mmg-group-firmalar-ready', function(){
    if(!activeTemplate) return;
    const firmaField = activeTemplate.fields.find(function(f){ return f.key === 'firma'; });
    if(!firmaField) return;
    const dl = document.getElementById('dl_firma');
    if(!dl) return;
    let saved = readSavedList(firmaField.source);
    const grupAdlari = (window.mmgGroupFirmalar || []).map(function(g){ return g.name; });
    saved = grupAdlari.concat(saved.filter(function(s){ return grupAdlari.indexOf(s) === -1; }));
    dl.innerHTML = saved.map(function(s){ return '<option value="' + String(s).replace(/"/g,'&quot;') + '">'; }).join('');
  });
</script>
