<!DOCTYPE html>
<html lang="tr">
<head>
<script src="i18n-core.js"></script>
<script>
(function(){
  try{
    var mode = localStorage.getItem('mmg_theme') || 'dark';
    document.documentElement.classList.toggle('theme-light', mode === 'light');
  }catch(e){}
  window.addEventListener('message', function(ev){
    if(ev && ev.data && ev.data.mmgTheme){
      document.documentElement.classList.toggle('theme-light', ev.data.mmgTheme === 'light');
      try{ localStorage.setItem('mmg_theme', ev.data.mmgTheme); }catch(e2){}
    }
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mmgcreativity — Günlük Panorama</title>
<meta name="theme-color" content="#0D1420">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1420; --surface:#141C2B; --surface-2:#1B2536; --hairline:#2A3448;
    --text:#EAEDF3; --muted:#8D96AC; --brass:#C6A15B; --brass-dim:#8A7440;
    --red:#E2544B; --amber:#E3A23C; --teal:#3FB68A; --blue:#5B9BC4;
    --coral:#FF6B4A; --magenta:#D6407A; --violet:#7C4DD9; --azure:#3E8FE0;
    --grad:linear-gradient(120deg, var(--coral), var(--magenta) 45%, var(--violet) 75%, var(--azure));
  }
  html.theme-light{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --hairline:#DCE0E6;
    --text:#1B2230; --muted:#6B7383; --brass:#9A7B3F; --brass-dim:#B8A06C;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; padding-bottom:60px; }
  header.masthead{ max-width:1180px; margin:0 auto; padding:32px 24px 20px; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--hairline); flex-wrap:wrap; gap:16px; }
  h1.title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(22px,4vw,34px); margin:0; }
  .subtitle{ color:var(--muted); font-size:14px; margin-top:6px; max-width:820px; }
  .top-actions{ display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
  .back-link,.ghost-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); font-weight:600; text-decoration:none; border:1px solid var(--hairline); padding:8px 14px; border-radius:8px; background:var(--surface-2); cursor:pointer; }
  .ghost-btn:hover,.back-link:hover{ border-color:var(--brass-dim); }
  main{ max-width:1180px; margin:0 auto; padding:28px 24px; }
  .card{ background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
  .card h3{ font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 14px; color:var(--brass); }
  label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  input,select{ width:100%; height:38px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:8px; padding:0 11px; color:var(--text); font-family:'Inter',sans-serif; font-size:13px; outline:none; color-scheme:dark; }
  html.theme-light input, html.theme-light select{ color-scheme:light; }
  input:focus,select:focus{ border-color:var(--brass-dim); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end; }
  .field{ min-width:0; }
  .btn-primary{ background:var(--grad); border:none; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; height:40px; padding:0 20px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn-primary:hover{ opacity:.92; }
  .type-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .type-tab{ padding:8px 12px; border-radius:8px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text); cursor:pointer; font-size:12.5px; font-weight:600; }
  .type-tab.active{ border-color:var(--brass); background:rgba(198,161,91,0.14); color:var(--brass); }
  .io-msg{ font-size:12px; margin-top:8px; min-height:14px; }
  .io-msg.ok{ color:var(--teal); } .io-msg.err{ color:var(--red); }
  .date-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .date-bar input[type=date]{ width:auto; }
  .nav-arrow{ width:36px; height:36px; border-radius:8px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text); cursor:pointer; font-size:14px; }
  .nav-arrow:hover{ border-color:var(--brass-dim); }
  .pano-section{ margin-bottom:18px; }
  .pano-head{ display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); border:1px solid var(--hairline); border-radius:10px 10px 0 0; padding:10px 14px; }
  .pano-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; }
  .pano-total{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; }
  table.pano{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--hairline); border-top:none; border-radius:0 0 10px 10px; overflow:hidden; font-size:12.5px; }
  table.pano th{ text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--hairline); font-weight:700; }
  table.pano td{ padding:8px 10px; border-bottom:1px solid var(--hairline); }
  table.pano tr:last-child td{ border-bottom:none; }
  .amt{ font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; white-space:nowrap; }
  .del-x{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; }
  .del-x:hover{ color:var(--red); }
  .empty{ color:var(--muted); font-size:12.5px; padding:12px 4px; }
  .badge-takas{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; border:1px solid var(--amber); color:var(--amber); border-radius:4px; padding:1px 5px; margin-left:6px; }
  .records-toggle{ margin-top:8px; }
  @media (max-width:760px){ header.masthead{ flex-direction:column; align-items:stretch; } main{ padding:20px 14px; } }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1 class="title">Günlük Panorama</h1>
    <div class="subtitle">Müşteri/firma çekleri, senetler, kredi kartları, taksitler ve teminat komisyonları — seçtiğiniz güne düşen tüm ödemeler tek ekranda. Çek başka bankaya takasa verildiyse tahsil tarihi otomatik +1 iş günü hesaplanır.</div>
  </div>
  <div class="top-actions">
    <a class="back-link" href="index.html">← Ana Sayfa</a>
  </div>
</header>

<main>
  <!-- Kayıt ekleme -->
  <div class="card">
    <h3>Kayıt Ekle</h3>
    <div class="type-tabs" id="typeTabs">
      <button type="button" class="type-tab active" data-tip="musteriCeki">Müşteri Çeki</button>
      <button type="button" class="type-tab" data-tip="firmaCeki">Firma Çeki</button>
      <button type="button" class="type-tab" data-tip="musteriSenedi">Müşteri Senedi</button>
      <button type="button" class="type-tab" data-tip="borcSenedi">Borç Senedi</button>
      <button type="button" class="type-tab" data-tip="krediKarti">Kredi Kartı</button>
      <button type="button" class="type-tab" data-tip="krediTaksiti">Kredi Taksiti</button>
      <button type="button" class="type-tab" data-tip="teminat">Teminat Komisyonu</button>
    </div>
    <div class="form-grid" id="formGrid"></div>
    <div style="margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button type="button" class="btn-primary" id="addBtn">+ Kaydet</button>
      <span class="io-msg" id="formMsg"></span>
    </div>
    <datalist id="bankList">
      <option value="AKBANK"><option value="GARANTİ BBVA"><option value="İŞ BANKASI"><option value="YAPI KREDİ">
      <option value="ZİRAAT BANKASI"><option value="HALKBANK"><option value="VAKIFBANK"><option value="QNB FİNANSBANK">
      <option value="TEB"><option value="DENİZBANK"><option value="ING"><option value="ŞEKERBANK"><option value="TÜRKİYE FİNANS">
    </datalist>
  </div>

  <!-- Panorama -->
  <div class="card">
    <div class="date-bar">
      <button type="button" class="nav-arrow" id="prevDay">◀</button>
      <input type="date" id="panoDate">
      <button type="button" class="nav-arrow" id="nextDay">▶</button>
      <button type="button" class="ghost-btn" id="todayBtn">📍 Bugün</button>
      <span style="color:var(--muted);font-size:12.5px;" id="panoDow"></span>
    </div>
    <div id="panoContainer"></div>
  </div>
</main>

<!-- Panorama uygulama mantığı -->
<script>
(function(){
  const TR = new Intl.NumberFormat('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  function fmt(n){ return TR.format(Number(n)||0) + ' TL'; }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function normBank(s){ return (s||'').trim().toLocaleLowerCase('tr'); }
  function parseTR(s){ if(typeof s==='number') return s; s=String(s||'').replace(/\./g,'').replace(',','.').replace(/[^0-9.\-]/g,''); const n=parseFloat(s); return isNaN(n)?0:n; }
  function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // N iş günü ekle (hafta sonu atlanır)
  function addBusinessDays(dateStr, days){
    const d = new Date(dateStr+'T00:00:00');
    let added = 0;
    while(added < days){ d.setDate(d.getDate()+1); const dow=d.getDay(); if(dow!==0 && dow!==6) added++; }
    return ymd(d);
  }
  function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return ymd(d); }

  const CEK_TIPLERI = ['musteriCeki','firmaCeki','musteriSenedi','borcSenedi'];
  // Kaydın panoramada hangi güne düşeceği (çek/senet: takas kuralıyla tahsil tarihi)
  function effectiveDate(rec){
    if(CEK_TIPLERI.indexOf(rec.tip) !== -1){
      if(rec.vade && rec.takasBanka && rec.cekBanka && normBank(rec.takasBanka) !== normBank(rec.cekBanka)){
        return addBusinessDays(rec.vade, 1);
      }
      return rec.vade || '';
    }
    if(rec.tip === 'teminat'){
      // "Sonraki gün teminat komisyonu": vade ertesi güne ait komisyon; o güne göster
      return rec.vade || '';
    }
    return rec.vade || '';
  }
  function isTakasGecikme(rec){
    return CEK_TIPLERI.indexOf(rec.tip)!==-1 && rec.vade && rec.takasBanka && rec.cekBanka && normBank(rec.takasBanka)!==normBank(rec.cekBanka);
  }

  // Alan tanımları (tipe göre form)
  const FIELDS = {
    musteriCeki: ['firma','vade','seriNo','portfoyNo','tutar','borclu','cekiVeren','takasBanka','cekBanka','durum'],
    firmaCeki:   ['firma','vade','seriNo','portfoyNo','tutar','borclu','cekiVeren','takasBanka','cekBanka','durum'],
    musteriSenedi:['firma','vade','seriNo','portfoyNo','tutar','borclu','cekiVeren','takasBanka','cekBanka','durum'],
    borcSenedi:  ['firma','vade','seriNo','portfoyNo','tutar','borclu','cekiVeren','takasBanka','cekBanka','durum'],
    krediKarti:  ['firma','vade','banka','kartNo','tutar'],
    krediTaksiti:['firma','vade','banka','tutar','aciklama','krediNo'],
    teminat:     ['firma','vade','banka','muhatap','mektupNo','tutar']
  };
  const LABELS = {
    firma:'Firma', vade:'Vade', seriNo:'Seri No', portfoyNo:'Portföy No', tutar:'Tutar',
    borclu:'Borçlu', cekiVeren:'Çeki Veren', takasBanka:'Takasa Verilen Banka', cekBanka:'Çekin Bankası',
    durum:'Durum', banka:'Banka', kartNo:'Kart No', aciklama:'Açıklama', krediNo:'Kredi No',
    muhatap:'Muhatap', mektupNo:'Mektup No'
  };
  const TIP_ADI = {
    musteriCeki:'Müşteri Çekleri', firmaCeki:'Firma Çekleri', musteriSenedi:'Müşteri Senetleri',
    borcSenedi:'Borç Senetleri', krediKarti:'Hesabı Kesilecek Kredi Kartları', krediTaksiti:'Kredi Taksitleri',
    teminat:'Teminat Mektubu Komisyonu'
  };
  const BANKA_ALAN = { takasBanka:true, cekBanka:true, banka:true };

  let records = [];
  let curTip = 'musteriCeki';
  let panoDate = todayStr();

  // ---------- Depolama ----------
  function localKey(){ const c=window.mmgCloud||{}; return 'mmg_panorama_' + (c.scopeCollection||'users') + '_' + (c.scopeId||'guest'); }
  function loadLocal(){ try{ const r=localStorage.getItem(localKey()); return r?JSON.parse(r):[]; }catch(e){ return []; } }
  function saveLocal(){ try{ localStorage.setItem(localKey(), JSON.stringify(records)); }catch(e){} }
  async function loadCloud(){
    const c = window.mmgCloud; if(!c || !c.currentUser) return null;
    try{
      const snap = await c.getDoc(c.doc(c.db, c.scopeCollection, c.scopeId, 'panorama', 'kayitlar'));
      return snap.exists() ? (snap.data().records || []) : [];
    }catch(e){ return null; }
  }
  async function saveCloud(){
    const c = window.mmgCloud; if(!c || !c.currentUser) return;
    try{ await c.setDoc(c.doc(c.db, c.scopeCollection, c.scopeId, 'panorama', 'kayitlar'), { records: records, updatedAt: Date.now() }); }catch(e){}
  }
  async function persist(){ saveLocal(); await saveCloud(); }

  // ---------- Form ----------
  function buildForm(){
    const grid = document.getElementById('formGrid');
    const fields = FIELDS[curTip] || [];
    grid.innerHTML = fields.map(f => {
      const isBank = BANKA_ALAN[f];
      const type = f==='vade' ? 'date' : (f==='tutar' ? 'text' : 'text');
      const attrs = isBank ? ' list="bankList"' : (f==='tutar' ? ' inputmode="decimal" placeholder="0,00"' : '');
      return '<div class="field"><label>'+escHtml(LABELS[f]||f)+'</label>'+
        '<input type="'+type+'" data-f="'+f+'"'+attrs+'></div>';
    }).join('');
  }
  function readForm(){
    const rec = { id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), tip: curTip };
    document.querySelectorAll('#formGrid [data-f]').forEach(inp => {
      const f = inp.dataset.f;
      rec[f] = (f==='tutar') ? parseTR(inp.value) : inp.value.trim();
    });
    return rec;
  }

  document.getElementById('typeTabs').addEventListener('click', (e)=>{
    const tab = e.target.closest('.type-tab'); if(!tab) return;
    curTip = tab.dataset.tip;
    document.querySelectorAll('.type-tab').forEach(t=>t.classList.toggle('active', t===tab));
    buildForm();
  });

  document.getElementById('addBtn').addEventListener('click', async ()=>{
    const rec = readForm();
    const msg = document.getElementById('formMsg');
    if(!rec.firma){ msg.textContent='Firma girin.'; msg.className='io-msg err'; return; }
    if(!rec.vade){ msg.textContent='Vade tarihi girin.'; msg.className='io-msg err'; return; }
    if(!rec.tutar && rec.tip!=='teminat'){ /* teminat komisyon tutarı da tutar alanında */ }
    if(!rec.tutar){ msg.textContent='Tutar girin.'; msg.className='io-msg err'; return; }
    records.push(rec);
    await persist();
    msg.textContent='Kaydedildi ✓'; msg.className='io-msg ok';
    // formu temizle (firma hariç kolaylık için hepsini temizle)
    document.querySelectorAll('#formGrid [data-f]').forEach(inp=> inp.value='');
    render();
    setTimeout(()=>{ if(msg.textContent==='Kaydedildi ✓'){ msg.textContent=''; msg.className='io-msg'; } }, 1800);
  });

  // ---------- Panorama render ----------
  function sectionRows(tip, list){
    const isCek = CEK_TIPLERI.indexOf(tip)!==-1;
    let cols;
    if(isCek) cols = ['Firma','Vade','Tahsil','Seri No','Tutar','Borçlu','Çeki Veren','Takas Banka','Çek Bankası','Durum',''];
    else if(tip==='krediKarti') cols = ['Firma','Banka','Kart No','Tutar',''];
    else if(tip==='krediTaksiti') cols = ['Firma','Banka','Taksit Tutarı','Açıklama','Kredi No',''];
    else cols = ['Firma','Banka','Muhatap','Mektup No','Komisyon','']; // teminat
    let total = 0;
    const body = list.map(rec => {
      total += Number(rec.tutar)||0;
      let tds;
      if(isCek){
        const tk = isTakasGecikme(rec) ? '<span class="badge-takas">+1 iş günü</span>' : '';
        tds = '<td>'+escHtml(rec.firma)+'</td>'+
          '<td>'+escHtml(fmtDate(rec.vade))+'</td>'+
          '<td>'+escHtml(fmtDate(effectiveDate(rec)))+tk+'</td>'+
          '<td>'+escHtml(rec.seriNo||'')+'</td>'+
          '<td class="amt">'+fmt(rec.tutar)+'</td>'+
          '<td>'+escHtml(rec.borclu||'')+'</td>'+
          '<td>'+escHtml(rec.cekiVeren||'')+'</td>'+
          '<td>'+escHtml(rec.takasBanka||'')+'</td>'+
          '<td>'+escHtml(rec.cekBanka||'')+'</td>'+
          '<td>'+escHtml(rec.durum||'')+'</td>';
      } else if(tip==='krediKarti'){
        tds = '<td>'+escHtml(rec.firma)+'</td><td>'+escHtml(rec.banka||'')+'</td><td>'+escHtml(rec.kartNo||'')+'</td><td class="amt">'+fmt(rec.tutar)+'</td>';
      } else if(tip==='krediTaksiti'){
        tds = '<td>'+escHtml(rec.firma)+'</td><td>'+escHtml(rec.banka||'')+'</td><td class="amt">'+fmt(rec.tutar)+'</td><td>'+escHtml(rec.aciklama||'')+'</td><td>'+escHtml(rec.krediNo||'')+'</td>';
      } else {
        tds = '<td>'+escHtml(rec.firma)+'</td><td>'+escHtml(rec.banka||'')+'</td><td>'+escHtml(rec.muhatap||'')+'</td><td>'+escHtml(rec.mektupNo||'')+'</td><td class="amt">'+fmt(rec.tutar)+'</td>';
      }
      tds += '<td style="text-align:right;"><button type="button" class="del-x" data-del="'+rec.id+'">✕</button></td>';
      return '<tr>'+tds+'</tr>';
    }).join('');
    const thead = '<thead><tr>'+cols.map(c=>'<th'+(c==='Tutar'||c==='Komisyon'||c==='Taksit Tutarı'?' class="amt"':'')+'>'+c+'</th>').join('')+'</tr></thead>';
    return { html:'<table class="pano">'+thead+'<tbody>'+body+'</tbody></table>', total };
  }
  function fmtDate(s){ if(!s) return ''; const p=s.split('-'); if(p.length!==3) return s; return p[2]+'.'+p[1]+'.'+p[0]; }

  function render(){
    const cont = document.getElementById('panoContainer');
    const d = new Date(panoDate+'T00:00:00');
    document.getElementById('panoDow').textContent = d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear()+' · '+GUN[d.getDay()];
    // teminat "sonraki gün": panoDate'te, ertesi güne ait komisyonları göster
    const nextDay = addDays(panoDate, 1);
    let html = '';
    let grand = 0;
    const order = ['musteriCeki','firmaCeki','musteriSenedi','borcSenedi','krediKarti','krediTaksiti','teminat'];
    order.forEach(tip => {
      let list;
      if(tip==='teminat'){
        // Excel: "SONRAKİ GÜN TEMİNAT MEKTUBU KOMİSYON" → seçili günün ertesi günü vadesi olanlar
        list = records.filter(r => r.tip==='teminat' && r.vade === nextDay);
      } else {
        list = records.filter(r => r.tip===tip && effectiveDate(r) === panoDate);
      }
      if(!list.length) return;
      const { html:tbl, total } = sectionRows(tip, list);
      grand += total;
      const extra = tip==='teminat' ? ' <span style="color:var(--muted);font-weight:400;font-size:11px;">(sonraki gün: '+fmtDate(nextDay)+')</span>' : '';
      html += '<div class="pano-section"><div class="pano-head"><span class="pano-title">'+TIP_ADI[tip]+extra+'</span><span class="pano-total">'+fmt(total)+'</span></div>'+tbl+'</div>';
    });
    if(!html){ html = '<div class="empty">Bu güne ait kayıt yok. Yukarıdan kayıt ekleyin.</div>'; }
    else { html = '<div style="text-align:right;font-family:\'JetBrains Mono\',monospace;font-weight:700;margin-bottom:14px;font-size:14px;">Günün Toplamı: '+fmt(grand)+'</div>' + html; }
    cont.innerHTML = html;
  }

  document.getElementById('panoContainer').addEventListener('click', async (e)=>{
    const del = e.target.closest('[data-del]');
    if(del){ records = records.filter(r => r.id !== del.dataset.del); await persist(); render(); }
  });
  document.getElementById('prevDay').addEventListener('click', ()=>{ panoDate = addDays(panoDate,-1); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('nextDay').addEventListener('click', ()=>{ panoDate = addDays(panoDate,1); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('todayBtn').addEventListener('click', ()=>{ panoDate = todayStr(); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('panoDate').addEventListener('change', (e)=>{ if(e.target.value){ panoDate = e.target.value; render(); } });

  async function boot(){
    buildForm();
    document.getElementById('panoDate').value = panoDate;
    records = loadLocal();
    render();
    const cloud = await loadCloud();
    if(cloud){ records = cloud; saveLocal(); render(); }
  }
  // Scope hazır olunca (giriş/firma) bulut verisini çek
  document.addEventListener('mmg-scope-ready', async ()=>{
    const cloud = await loadCloud();
    if(cloud){ records = cloud; saveLocal(); render(); }
  });
  boot();
})();
</script>
</body>
</html>
