<!DOCTYPE html>
<html lang="tr">
<head>
<script src="i18n-core.js"></script>
<script src="mmg-odemeler-sync.js"></script>
<script>
(function(){
  try{
    var mode = localStorage.getItem('mmg_theme') || 'dark';
    document.documentElement.classList.toggle('theme-light', mode === 'light');
  }catch(e){}
  window.addEventListener('message', function(ev){
    if(ev && ev.data && ev.data.mmgTheme){
      document.documentElement.classList.toggle('theme-light', ev.data.mmgTheme === 'light');
      try{ localStorage.setItem('mmg_theme', ev.data.mmgTheme); }catch(e2){}
    }
  });
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mmgcreativity — Günlük Panorama</title>
<meta name="theme-color" content="#0D1420">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1420; --surface:#141C2B; --surface-2:#1B2536; --hairline:#2A3448;
    --text:#EAEDF3; --muted:#8D96AC; --brass:#C6A15B; --brass-dim:#8A7440;
    --red:#E2544B; --amber:#E3A23C; --teal:#3FB68A; --blue:#5B9BC4;
    --coral:#FF6B4A; --magenta:#D6407A; --violet:#7C4DD9; --azure:#3E8FE0;
    --grad:linear-gradient(120deg, var(--coral), var(--magenta) 45%, var(--violet) 75%, var(--azure));
  }
  html.theme-light{
    --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --hairline:#DCE0E6;
    --text:#1B2230; --muted:#6B7383; --brass:#9A7B3F; --brass-dim:#B8A06C;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; line-height:1.5; padding-bottom:60px; }
  header.masthead{ max-width:1080px; margin:0 auto; padding:32px 24px 20px; display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--hairline); flex-wrap:wrap; gap:16px; }
  h1.title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(22px,4vw,34px); margin:0; }
  .subtitle{ color:var(--muted); font-size:14px; margin-top:6px; max-width:760px; }
  .top-actions{ display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
  .back-link,.ghost-btn{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text); font-weight:600; text-decoration:none; border:1px solid var(--hairline); padding:8px 14px; border-radius:8px; background:var(--surface-2); cursor:pointer; }
  .ghost-btn:hover,.back-link:hover{ border-color:var(--brass-dim); }
  main{ max-width:1080px; margin:0 auto; padding:24px; }
  .date-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .date-bar input[type=date]{ height:38px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:8px; padding:0 11px; color:var(--text); font-size:13px; color-scheme:dark; }
  html.theme-light .date-bar input[type=date]{ color-scheme:light; }
  .nav-arrow{ width:36px; height:36px; border-radius:8px; border:1px solid var(--hairline); background:var(--surface-2); color:var(--text); cursor:pointer; font-size:14px; }
  .nav-arrow:hover{ border-color:var(--brass-dim); }
  .day-summary{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .sum-card{ flex:1; min-width:150px; background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:14px 16px; }
  .sum-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; }
  .sum-val{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; margin-top:6px; }
  .pos{ color:var(--teal); } .neg{ color:var(--red); }
  .pano-section{ margin-bottom:16px; }
  .pano-head{ display:flex; justify-content:space-between; align-items:center; background:var(--surface-2); border:1px solid var(--hairline); border-radius:10px 10px 0 0; padding:10px 14px; }
  .pano-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; }
  .pano-total{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; }
  table.pano{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--hairline); border-top:none; border-radius:0 0 10px 10px; overflow:hidden; font-size:13px; }
  table.pano th{ text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; padding:8px 12px; border-bottom:1px solid var(--hairline); font-weight:700; }
  table.pano td{ padding:9px 12px; border-bottom:1px solid var(--hairline); }
  table.pano tr:last-child td{ border-bottom:none; }
  .amt{ font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; white-space:nowrap; }
  .empty{ color:var(--muted); font-size:13px; padding:24px 4px; text-align:center; }
  .loading{ color:var(--muted); font-size:13px; padding:20px 4px; }
  @media (max-width:760px){ header.masthead{ flex-direction:column; align-items:stretch; } main{ padding:18px 14px; } }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1 class="title">Günlük Panorama</h1>
    <div class="subtitle">Gelirler ve Giderler'e girdiğiniz verilerden çekilir — seçtiğiniz güne düşen tüm tahsilat ve ödemeler kategorilere göre tek ekranda (Nakit Akış ile aynı veri).</div>
  </div>
  <div class="top-actions">
    <a class="back-link" href="Gelirler.html">💰 Gelirler</a>
    <a class="back-link" href="Giderler.html">💳 Giderler</a>
    <a class="back-link" href="index.html">← Ana Sayfa</a>
  </div>
</header>

<main>
  <div class="date-bar">
    <button type="button" class="nav-arrow" id="prevDay">◀</button>
    <input type="date" id="panoDate">
    <button type="button" class="nav-arrow" id="nextDay">▶</button>
    <button type="button" class="ghost-btn" id="todayBtn">📍 Bugün</button>
    <button type="button" class="ghost-btn" id="refreshBtn">🔄 Yenile</button>
    <span style="color:var(--muted);font-size:13px;" id="panoDow"></span>
  </div>

  <div class="day-summary" id="daySummary"></div>
  <div id="panoContainer"><div class="loading">Yükleniyor…</div></div>
</main>

<!-- Firebase / mmgCloud bootstrap -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCWzcRqmwhIBqjnYqyMoIrO8zj2p8oj5kU",
    authDomain: "mmgcreativity-31263.firebaseapp.com",
    projectId: "mmgcreativity-31263",
    storageBucket: "mmgcreativity-31263.firebasestorage.app",
    messagingSenderId: "243143536600",
    appId: "1:243143536600:web:daa53a2614b42a2ccb8cad",
    measurementId: "G-X8HEZRNWWS"
  };
  let auth, db;
  try{
    if(window.parent && window.parent !== window && window.parent.mmgAuth && window.parent.mmgDb){
      auth = window.parent.mmgAuth; db = window.parent.mmgDb;
    }
  }catch(e){}
  if(!auth || !db){ const fbApp = initializeApp(firebaseConfig); auth = getAuth(fbApp); db = getFirestore(fbApp); }
  window.mmgCloud = { auth, db, doc, getDoc, setDoc, collection, getDocs, currentUser:null, scopeId:null, scopeCollection:'users' };
  onAuthStateChanged(auth, async (user) => {
    window.mmgCloud.currentUser = user;
    window.mmgCloud.scopeId = user ? user.uid : null;
    window.mmgCloud.scopeCollection = 'users';
    if(user){
      try{
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : {};
        const activeScope = localStorage.getItem('mmg_active_data_scope');
        if(activeScope && activeScope !== 'personal'){
          window.mmgCloud.scopeCollection = 'firmaAccounts'; window.mmgCloud.scopeId = activeScope;
        } else if(activeScope === 'personal'){ /* users/uid */ }
        else if(data.companyId){
          window.mmgCloud.scopeCollection = 'companies';
          window.mmgCloud.scopeId = localStorage.getItem('mmg_active_company_id') || data.companyId;
        }
      }catch(e){}
    }
    document.dispatchEvent(new CustomEvent('mmg-scope-ready', { detail:{ scopeId: window.mmgCloud.scopeId } }));
  });
</script>

<!-- Panorama mantığı: MEVCUT Gelir/Gider (cashflow) verisini kategoriye göre gruplar -->
<script>
(function(){
  const TR = new Intl.NumberFormat('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  function fmt(n){ return TR.format(Number(n)||0) + ' TL'; }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymd(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayStr(){ return ymd(new Date()); }
  function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return ymd(d); }
  function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
  const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Kategori → Excel'deki bölüm başlığı eşlemesi (kalemin kategorisine göre gruplanır)
  const GELIR_SECTIONS = [
    { cat:'Çek Tahsilatı',  title:'Müşteri Çekleri' },
    { cat:'Senet Tahsilatı',title:'Müşteri Senetleri' },
    { cat:'Nakit Tahsilat', title:'Nakit Tahsilat' },
    { cat:'POS Tahsilatı',  title:'POS Tahsilatı' },
    { cat:'Faiz Geliri',    title:'Faiz Geliri' }
  ];
  const GIDER_SECTIONS = [
    { cat:'Kredi Kartı',            title:'Hesabı Kesilecek Kredi Kartları' },
    { cat:'Kredi / Taksit Ödemesi', title:'Kredi Taksitleri' },
    { cat:'Teminat Mektubu',        title:'Teminat Mektupları' },
    { cat:'Komisyon',               title:'Komisyonlar' },
    { cat:'Kira',                   title:'Kira' },
    { cat:'Maaş / Personel',        title:'Maaş / Personel' },
    { cat:'Tedarikçi / Stok',       title:'Tedarikçi / Stok' },
    { cat:'Vergi / SGK',            title:'Vergi / SGK' },
    { cat:'Fatura',                 title:'Faturalar' },
    { cat:'Diğer Gider',            title:'Diğer Gider' }
  ];

  let panoDate = todayStr();
  let monthCache = {}; // mk -> { dateKey: {gider:[], gelir:[]} }

  function scopeKeyPart(){ const c=window.mmgCloud||{}; return (c.scopeCollection||'users')+'_'+(c.scopeId||'guest'); }
  function localCashflowKey(mk){ return 'mmg_nat_scope_' + scopeKeyPart() + '_' + mk; }

  function loadLocalMonth(mk){
    try{ const r = localStorage.getItem(localCashflowKey(mk)); return r ? JSON.parse(r) : {}; }catch(e){ return {}; }
  }
  async function loadCloudMonth(mk){
    const c = window.mmgCloud; if(!c || !c.currentUser) return null;
    try{
      const snap = await c.getDoc(c.doc(c.db, c.scopeCollection, c.scopeId, 'cashflow', mk));
      return snap.exists() ? (snap.data().data || {}) : {};
    }catch(e){ return null; }
  }
  async function getMonth(mk, force){
    if(!force && monthCache[mk]) return monthCache[mk];
    // Önce vadesi gelen tekrarlı ödemeleri cashflow'a işle (Gelir/Gider'den beslenir)
    try{
      if(window.mmgCloud && window.mmgCloud.currentUser){
        if(typeof window.mmgMergeCloudPaymentsAndSync === 'function') await window.mmgMergeCloudPaymentsAndSync();
        if(typeof window.mmgMergeCloudGelirAndSync === 'function') await window.mmgMergeCloudGelirAndSync();
      } else if(typeof window.mmgRunPaymentSync === 'function'){
        window.mmgRunPaymentSync();
      }
    }catch(e){}
    let data = loadLocalMonth(mk);
    const cloud = await loadCloudMonth(mk);
    if(cloud && Object.keys(cloud).length) data = cloud;
    monthCache[mk] = data || {};
    return monthCache[mk];
  }

  function itemsByCategory(list){
    const map = {};
    (list||[]).forEach(it => {
      const cat = it.category || '';
      if(!map[cat]) map[cat] = [];
      map[cat].push(it);
    });
    return map;
  }

  function renderSection(title, items, color){
    let total = 0;
    const rows = items.map(it => {
      total += Number(it.amount)||0;
      return '<tr><td>'+escHtml(it.desc || '(açıklama yok)')+'</td><td class="amt" style="color:'+color+';">'+fmt(it.amount)+'</td></tr>';
    }).join('');
    return { html:'<div class="pano-section"><div class="pano-head"><span class="pano-title">'+escHtml(title)+'</span>'+
      '<span class="pano-total" style="color:'+color+';">'+fmt(total)+'</span></div>'+
      '<table class="pano"><thead><tr><th>Açıklama</th><th class="amt">Tutar</th></tr></thead><tbody>'+rows+'</tbody></table></div>', total };
  }

  async function render(){
    const cont = document.getElementById('panoContainer');
    const d = new Date(panoDate+'T00:00:00');
    document.getElementById('panoDow').textContent = d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear()+' · '+GUN[d.getDay()];
    cont.innerHTML = '<div class="loading">Yükleniyor…</div>';
    const mk = monthKeyOf(panoDate);
    const month = await getMonth(mk);
    const day = month[panoDate] || { gider:[], gelir:[] };
    const gelirMap = itemsByCategory(day.gelir);
    const giderMap = itemsByCategory(day.gider);

    let html = '';
    let totGelir = 0, totGider = 0;
    // Bilinen kategoriler (Excel sırası)
    const usedGelir = {}, usedGider = {};
    GELIR_SECTIONS.forEach(s => {
      const items = gelirMap[s.cat]; if(!items || !items.length) return;
      usedGelir[s.cat] = true;
      const r = renderSection(s.title + ' (Tahsilat)', items, 'var(--teal)'); html += r.html; totGelir += r.total;
    });
    GIDER_SECTIONS.forEach(s => {
      const items = giderMap[s.cat]; if(!items || !items.length) return;
      usedGider[s.cat] = true;
      const r = renderSection(s.title + ' (Ödeme)', items, 'var(--red)'); html += r.html; totGider += r.total;
    });
    // Eşleşmeyen (bilinmeyen kategori) kalemler
    Object.keys(gelirMap).forEach(cat => { if(usedGelir[cat]) return; const r = renderSection((cat||'Diğer Gelir')+' (Tahsilat)', gelirMap[cat], 'var(--teal)'); html += r.html; totGelir += r.total; });
    Object.keys(giderMap).forEach(cat => { if(usedGider[cat]) return; const r = renderSection((cat||'Diğer Gider')+' (Ödeme)', giderMap[cat], 'var(--red)'); html += r.html; totGider += r.total; });

    const net = totGelir - totGider;
    document.getElementById('daySummary').innerHTML =
      '<div class="sum-card"><div class="sum-label">Toplam Tahsilat</div><div class="sum-val pos">'+fmt(totGelir)+'</div></div>'+
      '<div class="sum-card"><div class="sum-label">Toplam Ödeme</div><div class="sum-val neg">'+fmt(totGider)+'</div></div>'+
      '<div class="sum-card"><div class="sum-label">Net</div><div class="sum-val '+(net>=0?'pos':'neg')+'">'+(net>=0?'':'-')+fmt(Math.abs(net))+'</div></div>';

    if(!html){ html = '<div class="empty">Bu güne ait kayıt yok.<br>Gelirler/Giderler sayfasından bu tarihe kayıt girin, burada otomatik görünür.</div>'; }
    cont.innerHTML = html;
  }

  document.getElementById('prevDay').addEventListener('click', ()=>{ panoDate = addDays(panoDate,-1); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('nextDay').addEventListener('click', ()=>{ panoDate = addDays(panoDate,1); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('todayBtn').addEventListener('click', ()=>{ panoDate = todayStr(); document.getElementById('panoDate').value = panoDate; render(); });
  document.getElementById('refreshBtn').addEventListener('click', ()=>{ monthCache = {}; render(); });
  document.getElementById('panoDate').addEventListener('change', (e)=>{ if(e.target.value){ panoDate = e.target.value; render(); } });

  function boot(){
    document.getElementById('panoDate').value = panoDate;
    render();
  }
  document.addEventListener('mmg-scope-ready', ()=>{ monthCache = {}; render(); });
  boot();
})();
</script>
</body>
</html>
